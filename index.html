<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.css"
    integrity="sha512-4wfcoXlib1Aq0mUtsLLM74SZtmB73VHTafZAvxIp/Wk9u1PpIsrfmTvK0+yKetghCL8SHlZbMyEcV8Z21v42UQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <body bgcolor="#F5F7FA">
    <center>
      <h1><i class="fas fa-home"></i> Home Loan EMI Calculator</h1>

      <form action="">
        <label for=""> Loan Amount (₹): </label> <br />
        <input type="text" name="" id="" placeholder="Enter Amount" size="50" />
        <br />
        <span>Please Enter Loan Amount !!</span> <br> <br>
        <label for=""> Annual Interest Rate (%): </label> <br />
        <input
          type="text"
          name=""
          id=""
          placeholder="enter Rate ex: 7.5"
          size="50"
        />
        <br />
        <span>Please Enter Rate Of Interest !!</span> <br> <br>
        <label for="">Tenure (In Years):</label> <br />
        <input type="text" placeholder="Enter Years ex:5" size="50" /> <br> <br>
        <input type="submit" value="Calculate EMI" disabled="disabled">
      </form>
    </center>
  </body>
</html>
